server {
    listen 80;
    server_name 193.122.220.182.nip.io;
    
    # Redirect all HTTP to HTTPS
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;

    # Re-resolve container names via Docker's embedded DNS on every request
    # (15s cache). Without this, nginx resolves upstreams once at startup;
    # a recreated backend/frontend container gets a NEW IP and every request
    # 502s until the gateway itself is restarted.
    resolver 127.0.0.11 valid=15s ipv6=off;
    server_name 193.122.220.182.nip.io;
    client_max_body_size 100M;

    # SSL Certs
    ssl_certificate /etc/letsencrypt/live/193.122.220.182.nip.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/193.122.220.182.nip.io/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Gzip compression for edge hardening & efficiency
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
    gzip_min_length 256;
    gzip_proxied any;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";

    # Frontends
    location / {
        set $upstream_fe_admin "frontend-admin:80";
        proxy_pass http://$upstream_fe_admin;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /agent/ {
        # Rewrite to drop /agent before sending to the container since the container just serves from root
        set $upstream_fe_agent "frontend-agent:80";
        rewrite ^/agent/(.*) /$1 break;
        proxy_pass http://$upstream_fe_agent;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /public/ {
        # Rewrite to drop /public before sending to the container
        set $upstream_fe_citizen "frontend-citizen:80";
        rewrite ^/public/(.*) /$1 break;
        proxy_pass http://$upstream_fe_citizen;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Evidence files: always download, never render inline in the browser.
    # Belt-and-braces behind the backend's content sniffing — even a
    # successful smuggle cannot execute script in the portal origin.
    location ^~ /static/uploads/ {
        add_header Content-Disposition "attachment" always;
        add_header X-Frame-Options "SAMEORIGIN";
        add_header X-Content-Type-Options "nosniff";
        add_header Referrer-Policy "strict-origin-when-cross-origin";
        set $upstream_backend "backend:8001";
        proxy_pass http://$upstream_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # API Backend
    location ~ ^/(auth|admin|upload|results|static|api|health|audit) {
        set $upstream_backend "backend:8001";
        proxy_pass http://$upstream_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Whole-country election scopes rewrite ~177k rows in one request and
        # legitimately take over a minute on this VM — never cut those off.
        proxy_connect_timeout 30s;
        proxy_send_timeout 330s;
        proxy_read_timeout 330s;

        # Guarantee that API endpoints never return HTML on gateway/upstream errors
        proxy_intercept_errors on;
        error_page 500 502 503 504 = @api_gateway_error;
    }

    location @api_gateway_error {
        default_type application/json;
        return 502 '{"detail":"Service temporarily unavailable. Please retry in a few seconds."}';
    }
}
