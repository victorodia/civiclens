server {
    listen 80;
    server_name 193.122.220.182.nip.io;
    
    # Redirect all HTTP to HTTPS
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name 193.122.220.182.nip.io;
    client_max_body_size 100M;

    # SSL Certs
    ssl_certificate /etc/letsencrypt/live/193.122.220.182.nip.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/193.122.220.182.nip.io/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Gzip compression for edge hardening & efficiency
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
    gzip_min_length 256;
    gzip_proxied any;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";

    # Frontends
    location / {
        proxy_pass http://frontend-admin:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /agent/ {
        # Rewrite to drop /agent before sending to the container since the container just serves from root
        rewrite ^/agent/(.*) /$1 break;
        proxy_pass http://frontend-agent:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /public/ {
        # Rewrite to drop /public before sending to the container
        rewrite ^/public/(.*) /$1 break;
        proxy_pass http://frontend-citizen:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # API Backend
    location ~ ^/(auth|admin|upload|results|static|api|health) {
        proxy_pass http://backend:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Guarantee that API endpoints never return HTML on gateway/upstream errors
        proxy_intercept_errors on;
        error_page 500 502 503 504 = @api_gateway_error;
    }

    location @api_gateway_error {
        default_type application/json;
        return 502 '{"detail":"Service temporarily unavailable. Please retry in a few seconds."}';
    }
}
