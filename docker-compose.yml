version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: civiclens_db
    environment:
      POSTGRES_USER: civiclens_admin
      POSTGRES_PASSWORD: super_secure_password_dev
      POSTGRES_DB: civiclens
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: civiclens_redis
    ports:
      - "6379:6379"
    restart: unless-stopped

volumes:
  postgres_data:
