version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: ${STACK_NAME:-civiclens}-db
    restart: always
    environment:
      POSTGRES_USER: civiclens_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: civiclens
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - civiclens_net

  redis:
    image: redis:7-alpine
    container_name: ${STACK_NAME:-civiclens}-redis
    restart: always
    networks:
      - civiclens_net

  backend:
    build:
      context: ./backend
    container_name: ${STACK_NAME:-civiclens}-backend
    restart: always
    environment:
      - DATABASE_URL=${DATABASE_URL:?set DATABASE_URL in .env}
      - REDIS_URL=redis://redis:6379/0
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:?set JWT_SECRET_KEY in .env}
      - POLYGON_RPC_URL=${POLYGON_RPC_URL:?set POLYGON_RPC_URL in .env}
      - POLYGON_PRIVATE_KEY=${POLYGON_PRIVATE_KEY:?set POLYGON_PRIVATE_KEY in .env}
      - GEOFENCE_RADIUS_METRES=${GEOFENCE_RADIUS_METRES:-400}
    volumes:
      # Evidence uploads must survive container rebuilds -- the food-truck
      # problem: files stored inside the container vanish on every deploy.
      - ${DATA_ROOT:-/home/ubuntu/civiclens-data}/uploads:/app/app/static/uploads
    depends_on:
      - db
      - redis
    networks:
      - civiclens_net

  frontend-admin:
    build:
      context: ./admin-portal
    container_name: ${STACK_NAME:-civiclens}-admin
    restart: always
    networks:
      - civiclens_net

  frontend-agent:
    build:
      context: ./agent-portal
    container_name: ${STACK_NAME:-civiclens}-agent
    restart: always
    networks:
      - civiclens_net

  frontend-citizen:
    build:
      context: ./citizen-portal
    container_name: ${STACK_NAME:-civiclens}-citizen
    restart: always
    networks:
      - civiclens_net

  gateway:
    build:
      context: ./nginx-gateway
    container_name: ${STACK_NAME:-civiclens}-gateway
    restart: always
    # Ports live in docker-compose.override.yml (dev, auto-loaded) and
    # docker-compose.prod.yml (prod). Never here.
    volumes:
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      - backend
      - frontend-admin
      - frontend-agent
      - frontend-citizen
    networks:
      - civiclens_net

volumes:
  pgdata:

networks:
  civiclens_net:
    driver: bridge
