# CivicLens production gateway.
# deploy/bootstrap.sh replaces __DOMAIN__ with the real domain before this
# file is mounted into the gateway container.

limit_req_zone $binary_remote_addr zone=auth:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=upload:10m rate=30r/m;
limit_req_zone $binary_remote_addr zone=api:20m rate=20r/s;

server {
    listen 80;
    server_name __DOMAIN__;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name __DOMAIN__;
    client_max_body_size 100M;
    server_tokens off;

    ssl_certificate /etc/letsencrypt/live/__DOMAIN__/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/__DOMAIN__/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
    gzip_min_length 256;
    gzip_proxied any;

    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";
    add_header Referrer-Policy "strict-origin-when-cross-origin";
    add_header Permissions-Policy "camera=(self), geolocation=(self)";
    # HSTS — safe to enable only because every vhost on this server is TLS.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # When Cloudflare is in front, uncomment to see real client IPs:
    # set_real_ip_from 173.245.48.0/20; ... (full ranges in Cloudflare docs)

    location / {
        limit_req zone=api burst=40 nodelay;
        proxy_pass http://frontend-admin:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /agent/ {
        limit_req zone=api burst=40 nodelay;
        rewrite ^/agent/(.*) /$1 break;
        proxy_pass http://frontend-agent:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /public/ {
        limit_req zone=api burst=40 nodelay;
        rewrite ^/public/(.*) /$1 break;
        proxy_pass http://frontend-citizen:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Login and evidence upload: tight per-IP throttles against brute force
    # and upload flooding. Bursts over the limit get 503 from nginx directly.
    location ~ ^/(auth|upload) {
        limit_req zone=auth burst=15 nodelay;
        limit_req zone=upload burst=30 nodelay;
        proxy_pass http://backend:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 30s;
        proxy_send_timeout 330s;
        proxy_read_timeout 330s;
        proxy_intercept_errors on;
        error_page 500 502 503 504 = @api_gateway_error;
    }

    # Evidence files: always download, never render inline in the browser.
    # Belt-and-braces behind the backend's content sniffing — even a
    # successful smuggle cannot execute script in the portal origin.
    location ^~ /static/uploads/ {
        add_header Content-Disposition "attachment" always;
        add_header X-Frame-Options "SAMEORIGIN";
        add_header X-Content-Type-Options "nosniff";
        add_header Referrer-Policy "strict-origin-when-cross-origin";
        proxy_pass http://backend:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ~ ^/(admin|results|static|api|health|audit) {
        limit_req zone=api burst=40 nodelay;
        proxy_pass http://backend:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 30s;
        proxy_send_timeout 330s;
        proxy_read_timeout 330s;
        proxy_intercept_errors on;
        error_page 500 502 503 504 = @api_gateway_error;
    }

    location @api_gateway_error {
        default_type application/json;
        return 502 '{"detail":"Service temporarily unavailable. Please retry in a few seconds."}';
    }
}
